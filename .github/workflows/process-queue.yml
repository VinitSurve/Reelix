name: Reelix Cloud Processing Queue

on:
  schedule:
    # Run periodically every 30 minutes to process queued items
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      max_jobs:
        description: "Maximum number of jobs to process in this run"
        required: false
        default: "5"
      whisper_model:
        description: "Whisper model size (tiny, base, small)"
        required: false
        default: "base"
      gemini_model:
        description: "Gemini model version"
        required: false
        default: "gemini-1.5-flash"

concurrency:
  group: reelix-processing
  cancel-in-progress: false

jobs:
  process-queue:
    name: Process Reelix Cloud Queue
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "workers/processor/requirements.txt"

      - name: Install system FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Cache Whisper model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-models-${{ github.event.inputs.whisper_model || 'base' }}
          restore-keys: |
            whisper-models-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r workers/processor/requirements.txt

      - name: Execute Cloud Processing Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ github.event.inputs.gemini_model || 'gemini-1.5-flash' }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          MAX_JOBS_PER_RUN: ${{ github.event.inputs.max_jobs || '5' }}
          WHISPER_MODEL: ${{ github.event.inputs.whisper_model || 'base' }}
        run: |
          python -m workers.processor.src.main
