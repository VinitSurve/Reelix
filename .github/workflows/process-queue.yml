name: Reelix Cloud Processing Queue

on:
  schedule:
    # Run periodically every 30 minutes to process queued items
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      target_item_id:
        description: "Optional specific item ID to process exclusively (e.g. b313dec3-e021-4885-92a1-f890b7c814b6)"
        required: false
        default: ""
      reprocess:
        description: "Set to 'true' to trigger a fresh generation reprocess for target_item_id"
        required: false
        default: "false"
      force_claim:
        description: "Set to 'true' to force supersede any active lease with a new attempt epoch"
        required: false
        default: "false"
      max_jobs:
        description: "Maximum number of jobs to process in this run"
        required: false
        default: "5"
      whisper_model:
        description: "Whisper model size (tiny, base, small)"
        required: false
        default: "base"
      gemini_model:
        description: "Gemini model version (Default: gemini-3.6-flash; alternative: gemini-3.8-flash)"
        required: false
        default: "gemini-3.6-flash"
      skip_ai:
        description: "Set to 'true' to skip optional Gemini AI analysis and complete honestly per Invariant 6"
        required: false
        default: "false"

concurrency:
  group: reelix-processing
  cancel-in-progress: false
  queue: max

jobs:
  process-queue:
    name: Process Reelix Cloud Queue
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "workers/processor/requirements.txt"

      - name: Install system FFmpeg and Tesseract OCR
        run: |
          if ! command -v ffmpeg &> /dev/null || ! command -v tesseract &> /dev/null; then
            sudo apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=15
            sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr
          fi
          ffmpeg -version | head -n 1
          tesseract --version | head -n 1

      - name: Cache Whisper model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-models-${{ github.event.inputs.whisper_model || 'base' }}
          restore-keys: |
            whisper-models-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r workers/processor/requirements.txt

      - name: Execute Cloud Processing Pipeline
        env:
          GEMINI_API_KEY: ${{ github.event.inputs.skip_ai == 'true' && '' || secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ github.event.inputs.gemini_model || vars.GEMINI_MODEL || secrets.GEMINI_MODEL || 'gemini-3.6-flash' }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID || vars.GDRIVE_FOLDER_ID }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          MAX_JOBS_PER_RUN: ${{ github.event.inputs.max_jobs || '5' }}
          WHISPER_MODEL: ${{ github.event.inputs.whisper_model || 'base' }}
          TARGET_ITEM_ID: ${{ github.event.inputs.target_item_id }}
          REPROCESS_ITEM: ${{ github.event.inputs.reprocess == 'true' && '1' || '0' }}
          FORCE_CLAIM: ${{ github.event.inputs.force_claim == 'true' || github.event.inputs.target_item_id != '' && '1' || '0' }}
        run: |
          python -m workers.processor.src.main
